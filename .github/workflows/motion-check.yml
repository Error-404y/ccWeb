name: Motion release checks
on:
  push:
    branches:
      - develop/v0.12.0
      - develop/v0.12.1
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check public/app.js && node --check server.mjs
      - run: npm test
